name: Descargar recursos (fotos y tipografía)

on:
  push:
    branches: [main]
    paths:
      - "scripts/descargar-recursos.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recursos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar y optimizar
        run: bash scripts/descargar-recursos.sh
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Agregar fotografías y tipografía locales"
          git push
